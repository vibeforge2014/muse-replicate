# session-worker：NOTIFY 驱动 + SKIP LOCKED claim，可水平扩副本（spec §4.1/§5.6）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mas-worker
  namespace: mas
spec:
  replicas: 1
  selector: { matchLabels: { app: mas-worker } }
  template:
    metadata:
      labels: { app: mas-worker }
    spec:
      serviceAccountName: mas-worker # 沙箱 Pod 管理（56-sandbox-rbac.yaml）
      initContainers:
        - name: wait-postgres # k8s 无 depends_on：TCP 探测直到 PG 就绪
          image: mas-server:latest
          imagePullPolicy: IfNotPresent
          command:
            - node
            - -e
            - "const net=require('node:net');function t(){const s=net.connect({port:5432,host:'postgres'});s.on('connect',()=>{console.log('pg up');process.exit(0)});s.on('error',()=>setTimeout(t,1000))}t()"
      containers:
        - name: worker
          image: mas-server:latest # 与 server 同镜像，command 覆盖
          imagePullPolicy: IfNotPresent
          command: ["npx", "tsx", "apps/worker/src/main.ts"]
          env:
            - { name: DATABASE_URL, value: "postgres://mas@postgres:5432/mas_dev" }
            # 对象存储走 MinIO（55-minio.yaml）——worker 与 api 必须同后端（checkpoint/输出一致性）
            - { name: MAS_OBJECT_STORE, value: s3 }
            - { name: MAS_S3_ENDPOINT, value: "http://minio.mas.svc.cluster.local:9000" }
            - { name: MAS_S3_ACCESS_KEY, value: mas-minio }
            - { name: MAS_S3_SECRET_KEY, value: mas-minio-dev-secret }
            - { name: MAS_S3_BUCKET, value: mas-objects }
            # OTel 链路（可选）：部署 collector 后取消注释即开启（spec §16）
            # - { name: MAS_OTLP_ENDPOINT, value: "http://otel-collector.observability.svc.cluster.local:4318" }
            # - { name: MAS_OTLP_SERVICE_NAME, value: mas-worker }
            # 沙箱 = 集群内 Pod（K8sSandboxProvider；56-sandbox-rbac.yaml 的 SA/PVC）
            - { name: MAS_SANDBOX_PROVIDER, value: k8s }
            # 并发冷启风暴（几十个 runsc Pod 同时调度）下 containerd 排队：放宽 Pod 起Running 等待
            - { name: MAS_K8S_POD_START_TIMEOUT_MS, value: "180000" }
            # TMPDIR 指到 PVC 挂载点 → 会话 home 落在共享卷上（沙箱 Pod subPath 可见）
            - { name: TMPDIR, value: /var/mas/sandboxes }
            # - { name: MAS_WARM_POOL_MIN, value: "2" }
            # - { name: MAS_RUNTIME_DRIVER, value: codex }
          volumeMounts:
            - { name: files, mountPath: /var/mas/files }
            - { name: snapshots, mountPath: /var/mas/snapshots }
            - { name: sandboxes, mountPath: /var/mas/sandboxes }
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            # spec §17.2：单 worker 50 并发会话 RSS < 2GB —— 容器上限须≥该门禁值，
            # 且每会话一个 driver 子进程（fake≈60MB/个），1Gi 在 ~10 并发就会被 OOMKill
            limits: { memory: 2Gi }
      volumes:
        - name: files
          persistentVolumeClaim: { claimName: mas-files }
        - name: snapshots
          persistentVolumeClaim: { claimName: mas-snapshots }
        - name: sandboxes
          persistentVolumeClaim: { claimName: mas-sandboxes }
