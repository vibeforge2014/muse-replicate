# 可观测：Prometheus 抓 mas-server /internal/metrics + Grafana 看板自动供给。
# 与 deploy/observability/（compose 形态）等价；看板 JSON 在 grafana-dashboards ConfigMap。
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: mas
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    rule_files:
      - /etc/prometheus/rules/*.yml
    scrape_configs:
      - job_name: mas
        metrics_path: /internal/metrics
        static_configs:
          - targets: ["mas-server:8080"]
      - job_name: mas-egress # egress-proxy 存活（spec §10：不可用必须告警）+ 决策计数
        metrics_path: /internal/metrics
        static_configs:
          - targets: ["mas-egress:8081"]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: mas
data:
  mas-alerts.yml: |
    # 与 deploy/observability/prometheus-rules.yml 同源（spec §16/§17）
    groups:
      - name: mas-availability
        rules:
          - alert: MasServerDown
            expr: up{job="mas"} == 0
            for: 1m
            labels: { severity: critical }
            annotations:
              summary: "mas-server 抓取失败超过 1 分钟（宕机或 /internal/metrics 不可达）"
          - alert: MasEgressDown
            expr: up{job="mas-egress"} == 0
            for: 1m
            labels: { severity: critical }
            annotations:
              summary: "egress-proxy 不可用：沙箱凭据出站 fail closed，平台必须告警（spec §10）"
      - name: mas-api-slo
        rules:
          - alert: MasApi5xxRate
            expr: sum(rate(mas_api_requests_total{code=~"5.."}[5m])) > 0.1
            for: 5m
            labels: { severity: warning }
            annotations:
              summary: "API 5xx 速率 {{ $value }} req/s 持续 5 分钟"
          - alert: MasApiLatencyHigh
            expr: sum(mas_api_latency_seconds_sum) / clamp_min(sum(mas_api_latency_seconds_count), 1) > 1
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "API 平均延迟超过 1s 持续 10 分钟"
      - name: mas-runtime
        rules:
          - alert: MasQueueBacklog
            expr: mas_executions{state="queued"} > 10
            for: 5m
            labels: { severity: warning }
            annotations:
              summary: "执行队列积压 {{ $value }} 条（worker 吞吐不足或卡死，spec §5.6）"
          - alert: MasStuckExecutions
            expr: mas_executions{state="running"} > 20
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "running 执行 {{ $value }} 条持续过久（租约丢失未回收？spec §5.6）"
          - alert: MasEgressDeniedSpike
            expr: increase(mas_egress_denied_total[5m]) > 5
            labels: { severity: warning }
            annotations:
              summary: "出站拒绝 5 分钟新增 {{ $value }} 次：疑似越权出网/凭据滥用（spec §10）"
          - alert: MasRuntimeRestartSpike
            expr: mas_runtime_restarts_total > 3
            labels: { severity: warning }
            annotations:
              summary: "近 24h 执行重试 {{ $value }} 次（driver/沙箱不稳定，spec §8）"
          - alert: MasServerMemoryHigh
            expr: mas_process_resident_memory_bytes > 1610612736
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "api 进程 RSS 持续超过 1.5Gi（逼近 §17.2 的 2GB 门禁）"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: mas
spec:
  replicas: 1
  selector: { matchLabels: { app: prometheus } }
  template:
    metadata:
      labels: { app: prometheus }
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.0
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus/prometheus.yml, subPath: prometheus.yml }
            - { name: rules, mountPath: /etc/prometheus/rules }
            - { name: data, mountPath: /prometheus }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: config
          configMap: { name: prometheus-config }
        - name: rules
          configMap: { name: prometheus-rules }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: mas
data:
  prometheus.yml: |
    apiVersion: 1
    datasources:
      - name: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: mas
data:
  mas.yml: |
    apiVersion: 1
    providers:
      - name: mas
        folder: MAS
        type: file
        options:
          path: /etc/grafana/provisioning/dashboards-json
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-json
  namespace: mas
data:
  mas-overview.json: |
    {
      "title": "MAS Overview", "uid": "mas-overview", "timezone": "browser", "refresh": "15s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        { "id": 1, "title": "API QPS（按路由）", "type": "timeseries", "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
          "targets": [{ "expr": "sum(rate(mas_api_requests_total[1m])) by (route)", "legendFormat": "{{route}}" }] },
        { "id": 2, "title": "API 5xx 速率", "type": "timeseries", "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 },
          "targets": [{ "expr": "sum(rate(mas_api_requests_total{code=~\"5..\"}[5m]))", "legendFormat": "5xx/s" }] },
        { "id": 3, "title": "平均延迟（按路由）", "type": "timeseries", "gridPos": { "x": 0, "y": 8, "w": 12, "h": 8 },
          "targets": [{ "expr": "mas_api_latency_seconds_sum / mas_api_latency_seconds_count", "legendFormat": "{{route}}" }] },
        { "id": 4, "title": "会话状态分布", "type": "timeseries", "gridPos": { "x": 12, "y": 8, "w": 12, "h": 8 },
          "targets": [{ "expr": "mas_sessions", "legendFormat": "{{status}}" }] },
        { "id": 5, "title": "SSE 实时连接", "type": "stat", "gridPos": { "x": 0, "y": 16, "w": 6, "h": 6 },
          "targets": [{ "expr": "mas_sse_connections" }] },
        { "id": 6, "title": "出站拒绝（egress deny）", "type": "timeseries", "gridPos": { "x": 6, "y": 16, "w": 6, "h": 6 },
          "targets": [{ "expr": "mas_egress_denied_total" }] },
        { "id": 7, "title": "模型 token 计量（gateway）", "type": "timeseries", "gridPos": { "x": 12, "y": 16, "w": 12, "h": 6 },
          "targets": [{ "expr": "mas_model_tokens_total", "legendFormat": "{{model}} {{kind}}" }] }
      ],
      "schemaVersion": 39, "version": 1
    }
  mas-runtime.json: |
    {
      "title": "MAS Runtime", "uid": "mas-runtime", "timezone": "browser", "refresh": "15s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        { "id": 1, "title": "执行队列（按状态，spec §5.6）", "type": "timeseries", "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
          "targets": [{ "expr": "mas_executions", "legendFormat": "{{state}}" }] },
        { "id": 2, "title": "轮均时延 / TTFT（近 1h，秒）", "type": "timeseries", "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 },
          "targets": [
            { "expr": "mas_session_turn_seconds_mean", "legendFormat": "turn" },
            { "expr": "mas_session_ttft_seconds_mean", "legendFormat": "ttft" }
          ] },
        { "id": 3, "title": "沙箱活跃数", "type": "stat", "gridPos": { "x": 0, "y": 8, "w": 6, "h": 6 },
          "targets": [{ "expr": "mas_sandbox_active" }] },
        { "id": 4, "title": "执行重试（近 24h）", "type": "stat", "gridPos": { "x": 6, "y": 8, "w": 6, "h": 6 },
          "targets": [{ "expr": "mas_runtime_restarts_total" }] },
        { "id": 5, "title": "egress 决策速率（按 outcome）", "type": "timeseries", "gridPos": { "x": 12, "y": 8, "w": 12, "h": 6 },
          "targets": [{ "expr": "sum(rate(mas_egress_requests_total[5m])) by (outcome)", "legendFormat": "{{outcome}}" }] },
        { "id": 6, "title": "出站拒绝事件（egress deny，累计）", "type": "timeseries", "gridPos": { "x": 0, "y": 14, "w": 8, "h": 6 },
          "targets": [{ "expr": "mas_egress_denied_total" }] },
        { "id": 7, "title": "api 进程 RSS（§17.2 门禁 2GB）", "type": "timeseries", "gridPos": { "x": 8, "y": 14, "w": 8, "h": 6 },
          "targets": [{ "expr": "mas_process_resident_memory_bytes", "legendFormat": "rss" }] },
        { "id": 8, "title": "组件存活（up）", "type": "stat", "gridPos": { "x": 16, "y": 14, "w": 8, "h": 6 },
          "targets": [{ "expr": "up{job=~\"mas.*\"}", "legendFormat": "{{job}}" }] }
      ],
      "schemaVersion": 39, "version": 1
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: mas
spec:
  replicas: 1
  selector: { matchLabels: { app: grafana } }
  template:
    metadata:
      labels: { app: grafana }
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.1.0
          env:
            - { name: GF_SECURITY_ADMIN_USER, value: admin }
            - { name: GF_SECURITY_ADMIN_PASSWORD, value: admin }
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "true" }
            - { name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer }
          volumeMounts:
            - { name: datasources, mountPath: /etc/grafana/provisioning/datasources }
            - { name: dashboards-provider, mountPath: /etc/grafana/provisioning/dashboards }
            - { name: dashboards-json, mountPath: /etc/grafana/provisioning/dashboards-json }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: datasources
          configMap: { name: grafana-datasources }
        - name: dashboards-provider
          configMap: { name: grafana-dashboards-provider }
        - name: dashboards-json
          configMap: { name: grafana-dashboards-json }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-np
  namespace: mas
spec:
  type: NodePort
  selector: { app: grafana }
  ports: [{ port: 3000, targetPort: 3000, nodePort: 31300 }]
