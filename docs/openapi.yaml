      operationId: upsertMemory
      summary: 写入 memory（MEM-02/03/04；precondition 按 head content_sha256，不一致 409）
      parameters: *dialect
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemoryUpsert" }
      responses:
        "201": { description: 新建（含 version/content_sha256） }
