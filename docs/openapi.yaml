openapi: 3.1.0
info:
  title: muse-replicate Managed Agents API
  version: 0.1.0
  description: |
    企业私有化 Managed Agents 平台（Meta Muse 复刻）的 HTTP API，方言为 BigModel Managed Agents 子集。

    **鉴权**：`Authorization: Bearer mas_sk_...` 或 `x-api-key: mas_sk_...`（任选其一）。

    **方言 headers**（建议随请求发送）：
    - `zai-version: 2026-05-26`
    - `zai-beta: managed-agents-2026-05-26`

    兼容 Anthropic 方言（`anthropic-version` / `anthropic-beta` / `x-api-key`），服务端按 header 自动检测方言并适配错误信封。

    **错误信封**（所有非 2xx）：
    ```json
    { "type": "error", "error": { "type": "invalid_request_error", "message": "...", "details": {} }, "request_id": "req_..." }
    ```

    **通用语义**：
    - 所有 POST 接受 `Idempotency-Key` header（同 key 同 body 回放首次响应，异 body 409 `idempotency_conflict`）；
    - 列表接口支持 `limit` / 分页游标（`next_page`），Files 用 `before_id`/`after_id`；
    - 事件日志是唯一事实来源：会话事件按 `seq` 单调定序；SSE 见 `GET /v1/sessions/{id}/events/stream`。
servers:
  - url: http://127.0.0.1:8080
    description: 本地部署（PORT 环境变量覆盖）
tags:
  - { name: Agents }
  - { name: Environments }
  - { name: Sessions }
  - { name: Events }
  - { name: Files }
  - { name: Vaults }
  - { name: Memory }
  - { name: Skills }
  - { name: Deployments }
  - { name: Webhooks }

# ---- 复用锚点（YAML anchor，非 OpenAPI 字段）----
x-anchors:
  dialect-params: &dialect
    - $ref: "#/components/parameters/ZaiVersion"
    - $ref: "#/components/parameters/ZaiBeta"
    - $ref: "#/components/parameters/IdempotencyKey"
  dialect-params-no-idem: &dialectGet
    - $ref: "#/components/parameters/ZaiVersion"
    - $ref: "#/components/parameters/ZaiBeta"

security:
  - bearerAuth: []
  - apiKeyHeader: []

paths:
  /v1/agents:
    post:
      tags: [Agents]
      operationId: createAgent
      summary: 创建 Agent（AGT-01）
      parameters: *dialect
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentCreate" }
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    get:
      tags: [Agents]
      operationId: listAgents
      summary: 列出 Agent（include_archived / created_at 过滤 / 游标分页）
      parameters:
        - $ref: "#/components/parameters/ZaiVersion"
        - $ref: "#/components/parameters/ZaiBeta"
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: include_archived, in: query, schema: { type: string, enum: ["true"] } }
        - { name: page, in: query, schema: { type: string }, description: "base64 游标（next_page 原样回传）" }
      responses:
        "200":
          description: Agent 列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Agent" } }
                  next_page: { type: [string, "null"] }
  /v1/agents/{id}:
    parameters: [{ $ref: "#/components/parameters/IdPath" }]
    get:
      tags: [Agents]
      operationId: getAgent
      summary: 查询单个 Agent（?version= 固定版本）
      parameters:
        - $ref: "#/components/parameters/ZaiVersion"
        - $ref: "#/components/parameters/ZaiBeta"
        - { name: version, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Agent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Agents]
      operationId: updateAgent
      summary: 更新 Agent（乐观锁 version；metadata 按键合并，数组整体替换；无变化不升版）
      parameters: *dialect
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentUpdate" }
      responses:
        "200":
          description: 更新后的 Agent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/agents/{id}/versions:
    get:
      tags: [Agents]
      operationId: listAgentVersions
      summary: Agent 全版本快照（每版本完整配置）
      parameters: *dialectGet
      responses:
        "200":
          description: 版本列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Agent" } }
                  next_page: { type: [string, "null"] }
  /v1/agents/{id}/archive:
    post:
      tags: [Agents]
      operationId: archiveAgent
      summary: 归档 Agent（幂等；联动归档其 Deployments）
      parameters: *dialect
      responses:
        "200":
          description: 归档后的 Agent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/environments:
    post:
      tags: [Environments]
      operationId: createEnvironment
      summary: 创建 Environment（ENV-01；networking/packages 校验）
      parameters: *dialect
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnvironmentCreate" }
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }
        "400": { $ref: "#/components/responses/BadRequest" }
    get:
      tags: [Environments]
      operationId: listEnvironments
      summary: 列出 Environment
      parameters:
        - $ref: "#/components/parameters/ZaiVersion"
        - $ref: "#/components/parameters/ZaiBeta"
        - { name: include_archived, in: query, schema: { type: string, enum: ["true"] } }
      responses:
        "200":
          description: Environment 列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Environment" } }
                  next_page: { type: [string, "null"] }
  /v1/environments/{id}:
    parameters: [{ $ref: "#/components/parameters/IdPath" }]
    get:
      tags: [Environments]
      operationId: getEnvironment
      summary: 查询单个 Environment
      parameters: *dialectGet
      responses:
        "200":
          description: Environment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Environments]
      operationId: updateEnvironment
      summary: 更新（config 整体替换；metadata 按键合并；归档后 400）
      parameters: *dialect
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnvironmentUpdate" }
      responses:
        "200":
          description: 更新后的 Environment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }
        "400": { $ref: "#/components/responses/BadRequest" }
    delete:
      tags: [Environments]
      operationId: deleteEnvironment
      summary: 删除 Environment（有会话引用时 409）
      parameters: *dialectGet
      responses:
        "200": { description: 删除成功（返回 id 与 type:environment_deleted） }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/environments/{id}/archive:
    post:
      tags: [Environments]
      operationId: archiveEnvironment
      summary: 归档 Environment（幂等）
      parameters: *dialect
      responses:
        "200":
          description: 归档后的 Environment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }

  /v1/sessions:
    post:
      tags: [Sessions]
      operationId: createSession
      summary: 创建会话（SES-01~10；agent 三形态引用 + 快照固化 + resources/vault_ids/initial_events）
      parameters: *dialect
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SessionCreate" }
      responses:
        "200":
          description: 创建的会话（status=idle）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    get:
      tags: [Sessions]
      operationId: listSessions
      summary: 列出会话（agent_id/agent_version/statuses/created_at/include_archived）
      parameters:
        - $ref: "#/components/parameters/ZaiVersion"
        - $ref: "#/components/parameters/ZaiBeta"
        - { name: agent_id, in: query, schema: { type: string } }
        - { name: agent_version, in: query, schema: { type: integer, minimum: 1 }, description: "需配合 agent_id" }
        - { name: statuses, in: query, schema: { type: string }, description: "逗号分隔：idle,running,rescheduling,terminated" }
        - { name: "created_at[gte]", in: query, schema: { type: string, format: date-time } }
        - { name: include_archived, in: query, schema: { type: string, enum: ["true"] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: 会话列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Session" } }
                  next_page: { type: [string, "null"] }
  /v1/sessions/{id}:
    parameters: [{ $ref: "#/components/parameters/IdPath" }]
    get:
      tags: [Sessions]
      operationId: getSession
      summary: 查询会话（含物化 status/stop_reason/usage/resources）
      parameters: *dialectGet
      responses:
        "200":
          description: 会话
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Sessions]
      operationId: updateSession
      summary: 更新 title/metadata；idle 时可整体替换 agent.tools/mcp_servers（running 409）
      parameters: *dialect
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SessionUpdate" }
      responses:
        "200":
          description: 更新后的会话
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Sessions]
      operationId: deleteSession
      summary: 删除会话（running 409；写 session.deleted 后清理事件/资源并关 SSE）
      parameters: *dialectGet
      responses:
        "200": { description: 删除成功（返回 id 与 type:session_deleted） }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/sessions/{id}/archive:
    post:
      tags: [Sessions]
      operationId: archiveSession
      summary: 归档会话（重复归档 409 session_archived；running 409）
      parameters: *dialect
      responses:
        "200":
          description: 归档后的会话
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/sessions/{id}/resources:
    parameters: [{ $ref: "#/components/parameters/IdPath" }]
    get:
      tags: [Sessions]
      operationId: listSessionResources
      summary: 列出挂载资源（file / memory_store / skill）
      parameters: *dialectGet
      responses:
        "200":
          description: 资源列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/SessionResource" } }
                  next_page: { type: [string, "null"] }
    post:
      tags: [Sessions]
      operationId: mountSessionResource
      summary: 运行中挂载资源（RES-02 / MEM-08 / SKL-06）
      parameters: *dialect
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SessionResourceMount" }
      responses:
        "200": { description: 挂载成功（返回资源对象） }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/sessions/{id}/resources/{rid}:
    delete:
      tags: [Sessions]
      operationId: unmountSessionResource
      summary: 卸载资源（下一轮物化时消失）
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - { name: rid, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: 卸载成功（返回 id 与 type:session_resource_deleted） }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/sessions/{id}/events:
    parameters: [{ $ref: "#/components/parameters/IdPath" }]
    post:
      tags: [Events]
      operationId: sendEvents
      summary: 发送用户事件（1-10 条；排队 processed_at=null；interrupt/confirmation 状态前置校验）
      parameters: *dialect
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventsSend" }
      responses:
        "200":
          description: 准入结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/SessionEvent" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    get:
      tags: [Events]
      operationId: listEvents
      summary: 历史事件（types/order/created_at/after_seq/limit≤100；排队事件排在 asc 末尾）
      parameters:
        - $ref: "#/components/parameters/ZaiVersion"
        - $ref: "#/components/parameters/ZaiBeta"
        - { name: types, in: query, schema: { type: string }, description: "逗号分隔事件类型" }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc] } }
        - { name: after_seq, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
        - { name: "created_at[gt]", in: query, schema: { type: string, format: date-time } }
        - { name: "created_at[gte]", in: query, schema: { type: string, format: date-time } }
        - { name: "created_at[lt]", in: query, schema: { type: string, format: date-time } }
        - { name: "created_at[lte]", in: query, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: 事件列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/SessionEvent" } }
                  next_page: { type: [string, "null"] }
  /v1/sessions/{id}/events/stream:
    get:
      tags: [Events]
      operationId: streamEvents
      summary: SSE 实时流（LISTEN/NOTIFY、15s 心跳、Last-Event-ID 回补、session.deleted 关闭）
      parameters:
        - $ref: "#/components/parameters/ZaiVersion"
        - $ref: "#/components/parameters/ZaiBeta"
        - { name: Last-Event-ID, in: header, schema: { type: string }, description: "从该事件 id 起回补" }
      responses:
        "200":
          description: "text/event-stream（event: 事件类型；data: 事件 JSON；: ping 心跳）"
          content:
            text/event-stream:
              schema: { type: string }

  /v1/files:
    post:
      tags: [Files]
      operationId: uploadFile
      summary: multipart 上传文件（FILE-01；sha256 服务端计算；文件名黑名单 FILE-02）
      parameters: *dialect
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: 上传成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileObject" }
        "400": { $ref: "#/components/responses/BadRequest" }
    get:
      tags: [Files]
      operationId: listFiles
      summary: 文件列表（before_id/after_id 分页；scope 过滤）
      parameters:
        - $ref: "#/components/parameters/ZaiVersion"
        - $ref: "#/components/parameters/ZaiBeta"
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: before_id, in: query, schema: { type: string } }
        - { name: after_id, in: query, schema: { type: string } }
        - { name: session_id, in: query, schema: { type: string } }
      responses:
        "200":
          description: 文件列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/FileObject" } }
                  next_page: { type: [string, "null"] }
  /v1/files/{id}:
    parameters: [{ $ref: "#/components/parameters/IdPath" }]
    get:
      tags: [Files]
      operationId: getFile
      summary: 文件元数据
      parameters: *dialectGet
      responses:
        "200":
          description: 文件元数据
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileObject" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Files]
      operationId: deleteFile
      summary: 删除文件
      parameters: *dialectGet
      responses:
        "200": { description: 删除成功 }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/files/{id}/content:
    get:
      tags: [Files]
      operationId: downloadFileContent
      summary: 下载文件内容（Content-Type 透传）
      parameters: *dialectGet
      responses:
        "200":
          description: 文件字节流
          content:
            application/octet-stream:
              schema: { type: string, format: binary }

  /v1/vaults:
    post:
      tags: [Vaults]
      operationId: createVault
      summary: 创建 Vault（VLT-01）
      parameters: *dialect
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VaultCreate" }
      responses:
        "200":
          description: 创建成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vault" }
    get:
      tags: [Vaults]
      operationId: listVaults
      summary: Vault 列表（include_archived）
      parameters:
        - $ref: "#/components/parameters/ZaiVersion"
        - $ref: "#/components/parameters/ZaiBeta"
        - { name: include_archived, in: query, schema: { type: string, enum: ["true"] } }
      responses:
        "200":
          description: Vault 列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Vault" } }
                  next_page: { type: [string, "null"] }
  /v1/vaults/{id}:
    parameters: [{ $ref: "#/components/parameters/IdPath" }]
    get:
      tags: [Vaults]
      operationId: getVault
      summary: 查询 Vault（含凭据，机密永不回显）
      parameters: *dialectGet
      responses:
        "200":
          description: Vault
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vault" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Vaults]
      operationId: deleteVault
      summary: 删除 Vault（有会话引用 409）
      parameters: *dialectGet
      responses:
        "200": { description: 删除成功 }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/vaults/{id}/archive:
    post:
      tags: [Vaults]
      operationId: archiveVault
      summary: 归档 Vault（幂等）
      parameters: *dialect
      responses:
        "200":
          description: 归档后的 Vault
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vault" }
  /v1/vaults/{id}/credentials:
    parameters: [{ $ref: "#/components/parameters/IdPath" }]
    get:
      tags: [Vaults]
      operationId: listCredentials
      summary: 凭据列表（只回 ***+末 4 位）
      parameters: *dialectGet
      responses:
        "200":
          description: 凭据列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Credential" } }
                  next_page: { type: [string, "null"] }
    post:
      tags: [Vaults]
      operationId: createCredential
      summary: 创建凭据（static_bearer/bearer/environment_variable；响应永不回显机密）
      parameters: *dialect
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CredentialCreate" }
      responses:
        "200":
          description: 创建成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Credential" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /v1/vaults/{id}/credentials/{cid}:
    get:
      tags: [Vaults]
      operationId: getCredential
      summary: 查询单条凭据（机密永不回显）
      parameters:
        - $ref: "#/components/parameters/ZaiVersion"
        - $ref: "#/components/parameters/ZaiBeta"
        - $ref: "#/components/parameters/IdPath"
        - { name: cid, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 凭据
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Credential" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Vaults]
      operationId: rotateCredential
      summary: 轮换凭据（同 type 只带机密；带身份键或改 type 400）
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - { name: cid, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CredentialRotate" }
      responses:
        "200":
          description: 轮换后的凭据
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Credential" }
    delete:
