components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "Authorization: Bearer mas_sk_..."
    apiKeyHeader:
      type: apiKey
      in: header
      name: x-api-key
      description: "x-api-key: mas_sk_...（BigModel/Anthropic 方言兼容）"
  parameters:
    ZaiVersion:
      name: zai-version
      in: header
      required: false
      schema: { type: string, default: "2026-05-26" }
      description: BigModel API 版本（等价 anthropic-version）
    ZaiBeta:
      name: zai-beta
      in: header
      required: false
      schema: { type: string, default: "managed-agents-2026-05-26" }
      description: Managed Agents beta 通道（等价 anthropic-beta）
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 255 }
      description: 幂等键（同 key 同 body 回放；异 body 409 idempotency_conflict）
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: string }
  responses:
    BadRequest:
      description: 请求体/参数不合法（invalid_request_error）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unauthorized:
      description: 缺失或无效凭证（authentication_error）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    NotFound:
      description: 资源不存在（not_found_error）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Conflict:
      description: 状态冲突 / 乐观锁 / 幂等冲突 / 引用约束（conflict_error）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  schemas:
    Error:
      type: object
      required: [type, message]
      properties:
        type:
          type: string
          enum: [invalid_request_error, authentication_error, permission_error, not_found_error, conflict_error, rate_limit_error, api_error, overloaded_error]
        message: { type: string }
        details:
          type: [object, "null"]
          additionalProperties: true
    ErrorEnvelope:
      type: object
      required: [type, error, request_id]
      properties:
        type: { const: error }
        error: { $ref: "#/components/schemas/Error" }
        request_id: { type: string }
    Timestamp:
      type: string
      format: date-time
    IdempotentList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { additionalProperties: true }
        next_page: { type: [string, "null"] }

    Agent:
      type: object
      required: [id, type, name, version]
      properties:
        id: { type: string, examples: ["agt_abc123"] }
        type: { const: agent }
        name: { type: string }
        description: { type: [string, "null"], maxLength: 2048 }
        model: { $ref: "#/components/schemas/AgentModel" }
        system: { type: [string, "null"], maxLength: 100000 }
        tools: { type: array, items: { $ref: "#/components/schemas/ToolConfig" } }
        mcp_servers: { type: array, items: { $ref: "#/components/schemas/McpServer" } }
        skills: { type: array, items: { type: string } }
        metadata: { type: object, additionalProperties: { type: string } }
        version: { type: integer, minimum: 1 }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
        archived_at: { type: [string, "null"], format: date-time }
    AgentModel:
      type: object
      required: [id]
      properties:
        id: { type: string, examples: ["glm-5.3-flash"] }
        effort: { type: string, enum: [low, medium, high, max] }
        speed: { type: string, enum: [standard] }
    ToolConfig:
      type: object
      additionalProperties: true
      required: [type]
      description: 工具声明——内置工具集（agent_toolset_*）、mcp_toolset、或自定义工具（type=custom：name/description/input_schema，由业务方实现执行体，经 user.custom_tool_result 回传）
      properties:
        type: { type: string }
    McpServer:
      type: object
      required: [type, name, url]
      properties:
        type: { const: url }
        name: { type: string, minLength: 1, maxLength: 128 }
        url: { type: string, pattern: "^https://" }
    AgentCreate:
      type: object
      required: [name, model]
      properties:
        name: { type: string, minLength: 1, maxLength: 256 }
        description: { type: [string, "null"], maxLength: 2048 }
        model: { $ref: "#/components/schemas/AgentModel" }
        system: { type: [string, "null"], maxLength: 100000 }
        tools: { type: array, maxItems: 128, items: { $ref: "#/components/schemas/ToolConfig" } }
        mcp_servers: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/McpServer" } }
        skills: { type: array, maxItems: 20, items: { type: string, minLength: 3, maxLength: 128 } }
        metadata: { type: object, additionalProperties: { type: string } }
    AgentUpdate:
      type: object
      properties:
        version: { type: integer, minimum: 1, description: 提供时做乐观锁校验（基于的当前版本） }
        name: { type: [string, "null"], minLength: 1, maxLength: 256 }
        description: { type: [string, "null"], maxLength: 2048 }
        model: { $ref: "#/components/schemas/AgentModel" }
        system: { type: [string, "null"], maxLength: 100000 }
        tools: { type: [array, "null"], maxItems: 128, items: { $ref: "#/components/schemas/ToolConfig" } }
        mcp_servers: { type: [array, "null"], maxItems: 20, items: { $ref: "#/components/schemas/McpServer" } }
        skills: { type: [array, "null"], maxItems: 20, items: { type: string } }
        metadata: { type: [object, "null"], additionalProperties: { type: [string, "null"] }, description: 按键合并；值为 null 删除该键；整体 null 清空 }

    Environment:
      type: object
      required: [id, type, name]
      properties:
        id: { type: string }
        type: { const: environment }
        name: { type: string }
        description: { type: [string, "null"], maxLength: 2048 }
        config: { $ref: "#/components/schemas/EnvironmentConfig" }
        metadata: { type: object, additionalProperties: { type: string } }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
        archived_at: { type: [string, "null"], format: date-time }
    EnvironmentConfig:
      type: object
      required: [type]
      properties:
        type: { const: cloud }
        packages:
          type: object
          properties:
            apt: { type: array, items: { type: string } }
            npm: { type: array, items: { type: string } }
            pip: { type: array, items: { type: string } }
            cargo: { type: array, items: { type: string } }
            gem: { type: array, items: { type: string } }
            go: { type: array, items: { type: string } }
        networking:
          oneOf:
            - type: object
              required: [type]
              properties:
                type: { const: unrestricted }
            - type: object
              required: [type, allowed_hosts]
              properties:
                type: { const: limited }
                allowed_hosts: { type: array, maxItems: 256, items: { type: string } }
                allow_package_managers: { type: boolean }
                allow_mcp_servers: { type: boolean }
        isolation: { type: string, enum: [gvisor, microvm, runc] }
    EnvironmentCreate:
      type: object
      required: [name, config]
      properties:
        name: { type: string, minLength: 1, maxLength: 256 }
        description: { type: [string, "null"], maxLength: 2048 }
        config: { $ref: "#/components/schemas/EnvironmentConfig" }
        metadata: { type: object, additionalProperties: { type: string } }
    EnvironmentUpdate:
      type: object
      properties:
        name: { type: [string, "null"], minLength: 1, maxLength: 256 }
        description: { type: [string, "null"], maxLength: 2048 }
        config: { $ref: "#/components/schemas/EnvironmentConfig", description: 整体替换 }
        metadata: { type: [object, "null"], additionalProperties: { type: [string, "null"] }, description: 按键合并 }

    Session:
      type: object
      required: [id, type, agent, status]
      properties:
        id: { type: string }
        type: { const: session }
        agent:
          type: object
          additionalProperties: true
          description: 建会话时固化的 agent 快照（含 id/name/model/system/tools 等）
        environment_id: { type: string }
        status: { type: string, enum: [idle, running, rescheduling, terminated] }
        stop_reason: { type: [object, "null"], additionalProperties: true }
        usage:
          type: object
          properties:
            input_tokens: { type: integer }
            output_tokens: { type: integer }
            cache_read_input_tokens: { type: integer }
        resources: { type: array, items: { $ref: "#/components/schemas/SessionResource" } }
        vault_ids: { type: array, items: { type: string } }
        title: { type: [string, "null"] }
        metadata: { type: object, additionalProperties: { type: string } }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
        archived_at: { type: [string, "null"], format: date-time }
    SessionCreate:
      type: object
      required: [agent]
      properties:
        agent:
          oneOf:
            - type: string
              description: "agent id（建会话时快照最新版本）"
            - type: object
              required: [type, id]
              properties:
                type: { const: agent }
                id: { type: string }
                version: { type: integer, minimum: 1 }
            - type: object
              required: [type, agent]
              properties:
                type: { const: agent_with_overrides }
                agent:
                  oneOf:
                    - type: string
                    - type: object
                      required: [id]
                      properties: { id: { type: string }, version: { type: integer, minimum: 1 } }
                system: { type: [string, "null"], maxLength: 100000 }
                tools: { type: array, items: {} }
                mcp_servers: { type: array, items: { type: object, additionalProperties: true } }
                model: {}
        environment_id: { type: string }
        title: { type: string }
        metadata: { type: object, additionalProperties: true }
        resources: { type: array, items: { $ref: "#/components/schemas/SessionResourceMount" } }
        vault_ids: { type: array, items: { type: string } }
        initial_events:
          type: array
          maxItems: 50
          description: 仅接受 user.message（建会话时立即排队执行）
          items: { type: object, additionalProperties: true }
    SessionUpdate:
      type: object
      properties:
        title: { type: [string, "null"] }
        metadata: { type: object, additionalProperties: true }
        tools: { type: array, items: { type: string }, description: 仅 idle 可改，整体替换 }
        mcp_servers: { type: array, items: { type: object, additionalProperties: true } }
    SessionResource:
      type: object
      description: file → 挂载 mount_path；memory_store → 固定 /mnt/memory/<slug>；skill → 固定 /workspace/skills/<directory>
      required: [type, mount_path]
      properties:
        type: { type: string, enum: [file, memory_store, skill] }
        file_id: { type: string }
        mount_path: { type: string }
        memory_store_id: { type: string }
        read_only: { type: boolean }
        skill_id: { type: string }
        skill_version: { type: [integer, "null"] }
    SessionResourceMount:
      type: object
      additionalProperties: true
      properties:
        type: { type: string, enum: [file, memory_store, skill] }
        file_id: { type: string }
        mount_path: { type: string }
        memory_store_id: { type: string }
        read_only: { type: boolean }
        skill_id: { type: string }
        version: { type: integer }

    SessionEvent:
      type: object
      description: payload 在顶层展开（content/subtype/usage 等）；排队事件 seq/processed_at 为 null
      required: [id, type]
      properties:
        id: { type: string }
        type: { type: string, examples: [user.message, agent.message, agent.custom_tool_use, user.custom_tool_result, session.status_running, session.status_idle, session.usage] }
        seq: { type: [integer, "null"] }
        processed_at: { type: [string, "null"], format: date-time }
        received_at: { $ref: "#/components/schemas/Timestamp" }
    EventsSend:
      type: object
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 10
          description: 整批原子；仅用户事件；requires_action 时只接受 tool_confirmation/interrupt
          items:
            oneOf:
              - type: object
                required: [type, content]
                properties:
                  type: { const: user.message }
                  content:
                    type: array
                    minItems: 1
                    maxItems: 20
                    items:
                      type: object
                      additionalProperties: true
                      required: [type]
                      properties:
                        type: { type: string, enum: [text, image, document] }
                        text: { type: string }
              - type: object
                required: [type]
                properties:
                  type: { const: user.interrupt }
              - type: object
                required: [type, tool_use_id, output]
                description: 自定义工具结果（spec §7.3 例外：收到即处理，返回时 processed_at 已有值）
                properties:
                  type: { const: user.custom_tool_result }
                  tool_use_id: { type: string, description: 对应 agent.custom_tool_use 事件 id（须在 requires_action 的 event_ids 中） }
                  output: { type: string, minLength: 1, maxLength: 64000 }
              - type: object
                required: [type, tool_use_id, result]
                properties:
                  type: { const: user.tool_confirmation }
                  tool_use_id: { type: string }
                  result: { type: string, enum: [allow, deny] }
                  deny_message: { type: string, maxLength: 4000 }

    FileObject:
      type: object
      required: [id, type, filename, bytes]
      properties:
        id: { type: string }
        type: { const: file }
        filename: { type: string }
        bytes: { type: integer }
        content_type: { type: [string, "null"] }
        sha256: { type: string }
        scope: { type: [string, "null"] }
        created_at: { $ref: "#/components/schemas/Timestamp" }

    Vault:
      type: object
      required: [id, type, name]
      properties:
        id: { type: string }
        type: { const: vault }
        name: { type: string }
        metadata: { type: object, additionalProperties: true }
        credentials:
          type: array
          items: { $ref: "#/components/schemas/Credential" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
        archived_at: { type: [string, "null"], format: date-time }
    VaultCreate:
      type: object
      required: [name]
      properties:
        name: { type: string }
        metadata: { type: object, additionalProperties: true }
    Credential:
      type: object
      required: [id, type]
      properties:
        id: { type: string }
        type: { const: credential }
        name: { type: [string, "null"] }
        credential_type: { type: string, enum: [static_bearer, bearer, environment_variable] }
        masked_value: { type: string, examples: ["***ab12"] }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
        archived_at: { type: [string, "null"], format: date-time }
    CredentialCreate:
      type: object
      additionalProperties: true
      required: [credential_type]
      properties:
        credential_type: { type: string, enum: [static_bearer, bearer, environment_variable] }
        name: { type: string }
        token: { type: string, description: static_bearer / bearer 的机密 }
        env_var: { type: string, description: environment_variable 的变量名 }
    CredentialRotate:
      type: object
      additionalProperties: true
      description: 只允许携带机密字段（token / env_var），身份键与 type 不可变
      properties:
        token: { type: string }
        env_var: { type: string }

    MemoryStore:
      type: object
      required: [id, type, name, slug]
      properties:
        id: { type: string }
        type: { const: memory_store }
        name: { type: string }
        slug: { type: string }
        description: { type: [string, "null"] }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
        archived_at: { type: [string, "null"], format: date-time }
    MemoryStoreCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        description: { type: string }
    Memory:
      type: object
      required: [id, type, path]
      properties:
        id: { type: string }
        type: { const: memory }
        path: { type: string, examples: ["notes/quarterly.md"] }
        content: { type: [string, "null"] }
        content_sha256: { type: [string, "null"], pattern: "^[0-9a-f]{64}$" }
        head_version: { type: integer, minimum: 1 }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    MemoryUpsert:
      type: object
      required: [path, content]
      properties:
        path: { type: string, maxLength: 1024 }
        content: { type: string, maxLength: 102400, description: ≤100KiB（UTF-8 字节） }
        precondition:
          type: object
          required: [type, content_sha256]
          properties:
            type: { const: content_sha256 }
            content_sha256: { type: string, pattern: "^[0-9a-f]{64}$", description: 期望的 head 内容哈希；不一致 409 }
    MemoryListItem:
      oneOf:
        - $ref: "#/components/schemas/Memory"
        - type: object
          required: [type, prefix]
          properties:
            type: { const: memory_prefix }
            prefix: { type: string }
    MemoryVersion:
      type: object
      required: [id, type, version]
      properties:
        id: { type: string }
        type: { const: memory_version }
        version: { type: integer, minimum: 1 }
        path: { type: [string, "null"] }
        content: { type: [string, "null"] }
        content_sha256: { type: [string, "null"] }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        redacted_at: { type: [string, "null"], format: date-time }

    Skill:
      type: object
      required: [id, type, directory]
      properties:
        id: { type: string }
        type: { const: skill }
        directory: { type: string }
        description: { type: [string, "null"] }
        source: { type: string, enum: [user, zai] }
        latest_version: { type: integer, minimum: 1 }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
        archived_at: { type: [string, "null"], format: date-time }
    SkillVersion:
      type: object
      required: [id, type, skill_id, version]
      properties:
        id: { type: string }
        type: { const: skill_version }
        skill_id: { type: string }
        version: { type: integer, minimum: 1 }
        sha256: { type: string }
        bytes: { type: integer }
        created_at: { $ref: "#/components/schemas/Timestamp" }

    Deployment:
      type: object
      required: [id, type, agent, environment_id, status]
      properties:
        id: { type: string }
        type: { const: deployment }
        agent:
          type: object
          required: [type, id, version]
          description: 创建时固定的 agent 版本引用
          properties:
            type: { const: agent }
            id: { type: string }
            version: { type: integer, minimum: 1 }
        environment_id: { type: string }
        schedule: { type: [string, "null"], examples: ["*/10 * * * *"], description: 5 字段 cron；相邻触发间隔 ≥5 分钟；时区固定 Asia/Shanghai }
        timezone: { type: string, examples: ["Asia/Shanghai"] }
        input: { type: [object, "null"], additionalProperties: true }
        status: { type: string, enum: [active, paused, archived] }
        upcoming_runs_at:
          type: array
          maxItems: 5
          items: { type: string, format: date-time }
          description: 实时计算；paused/archived 为空
        last_scheduled_at: { type: [string, "null"], format: date-time }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    DeploymentCreate:
      type: object
      required: [agent, environment_id]
      properties:
        agent: { type: string, description: agent id（创建时固定 head 版本） }
        environment_id: { type: string }
        schedule: { type: [string, "null"], description: 缺省 null = 仅手动 run }
        timezone: { type: string, description: 仅接受 Asia/Shanghai }
        input: { type: object, additionalProperties: true }
    DeploymentRun:
      type: object
      required: [id, type, deployment_id, trigger_type, status]
      properties:
        id: { type: string }
        type: { const: deployment_run }
        deployment_id: { type: string }
        trigger_type: { type: string, enum: [manual, schedule] }
        trigger_context: { type: [object, "null"], additionalProperties: true }
        scheduled_for: { type: [string, "null"], format: date-time }
        status: { type: string, enum: [pending, running, succeeded, failed] }
        session_id: { type: [string, "null"] }
        error: { type: [object, "null"], additionalProperties: true }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        finished_at: { type: [string, "null"], format: date-time }

    Webhook:
      type: object
      required: [id, type, url]
      properties:
        id: { type: string }
        type: { const: webhook }
        url: { type: string, format: uri }
        events: { type: array, items: { type: string }, description: 空数组 = 全部事件 }
        active: { type: boolean }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    WebhookCreated:
      allOf:
        - $ref: "#/components/schemas/Webhook"
        - type: object
          properties:
            secret:
              type: string
              description: 仅创建响应回显一次（whsec_...，Standard Webhooks v1 签名密钥）
    WebhookCreate:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri }
        events: { type: array, items: { type: string } }
    WebhookDelivery:
      type: object
      required: [id, type, webhook_id, status]
      properties:
        id: { type: string }
        type: { const: webhook_delivery }
        webhook_id: { type: string }
        event_type: { type: string }
        status: { type: string, enum: [pending, delivered, failed] }
        attempts: { type: integer }
        response_status: { type: [integer, "null"] }
        next_attempt_at: { type: [string, "null"], format: date-time }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
